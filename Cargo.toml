[workspace]
resolver = "2"
members = ["projects/*", "examples/*"]
default-members = [
    "projects/nyar-error",
    "projects/nyar-vm",
]
exclude = ["examples/valkyrie-bootstrap", "projects/nyar-cli", "examples/mini-c"]

[profile.release]
lto = true
opt-level = "s"

[workspace.dependencies]
gaia-jit = { path = "../project-gaia/projects/gaia-jit" }
gaia-types = { path = "../project-gaia/projects/gaia-types" }
gaia-assembler = { path = "../project-gaia/projects/gaia-assembler" }
pe-assembler = { path = "../project-gaia/examples/pe-assembler" }

criterion = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
byteorder = "1.5"
url = "2.5"
tempfile = "3.10"
