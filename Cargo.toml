[workspace]
resolver = "2"
members = [
    "projects/*",
    "examples/rusty-typescript",
    "examples/rusty-python",
    "examples/rusty-java",
    "examples/rusty-c",
    "examples/rusty-go",
    "examples/rusty-csharp",
    "examples/rusty-tcl",
    "examples/rusty-swift",
    "examples/rusty-julia",
    "examples/rusty-r",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nyar-vm/nyar-vm"
authors = ["The Nyar Project Developers"]
default-members = [
    "projects/nyar-types",
    "projects/nyar-vm",
]
exclude = ["examples/valkyrie-bootstrap", "projects/nyar-tools"]

[profile.release]
lto = true
opt-level = "s"

[workspace.dependencies]
chomsky = { path = "../ProjectChomsky/packages/chomsky", default-features = false }
chomsky-uir = { path = "../ProjectChomsky/packages/chomsky-uir" }
chomsky-cost = { path = "../ProjectChomsky/packages/chomsky-cost" }
chomsky-types = { path = "../ProjectChomsky/packages/chomsky-types" }
chomsky-extract = { path = "../ProjectChomsky/packages/chomsky-extract" }
chomsky-emit = { path = "../ProjectChomsky/packages/chomsky-emit" }
chomsky-rules = { path = "../ProjectChomsky/packages/chomsky-rules" }
chomsky-rule-engine = { path = "../ProjectChomsky/packages/chomsky-rule-engine" }
oak-core = { path = "../oaks/projects/oak-core" }
oak-vfs = { path = "../oaks/projects/oak-vfs" }
oak-repl = { path = "../oaks/projects/oak-repl" }
oak-rust = { path = "../oaks/examples/oak-rust" }
oak-c = { path = "../oaks/examples/oak-c" }
oak-typescript = { path = "../oaks/examples/oak-typescript" }
oak-go = { path = "../oaks/examples/oak-go" }
oak-kotlin = { path = "../oaks/examples/oak-kotlin" }
oak-python = { path = "../oaks/examples/oak-python" }
oak-java = { path = "../oaks/examples/oak-java" }
oak-lua = { path = "../oaks/examples/oak-lua" }
