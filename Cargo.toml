[workspace]
resolver = "2"
members = ["projects/*", "examples/*"]
default-members = [
    "projects/nyar-error",
    "projects/nyar-vm",
    "projects/nyar-cli",
]
exclude = ["projects/nyar-wasm32-wasi", "examples/valkyrie-bootstrap"]

[profile.release]
lto = true
opt-level = "s"

[workspace.dependencies]
gaia-jit = { path = "../project-gaia/projects/gaia-jit" }
gaia-types = { path = "../project-gaia/projects/gaia-types" }
gaia-assembler = { path = "../project-gaia/projects/gaia-assembler" }
pe-rust = { path = "projects/pe-rust" }
pe-assembler = { path = "../project-gaia/examples/pe-assembler" }

criterion = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
byteorder = "1.5"
url = "2.5"
tempfile = "3.10"
