[workspace]
resolver = "2"
members = [
    "projects/*",
    "examples/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nyar-vm/nyar-vm"
authors = ["The Nyar Project Developers"]
default-members = [
    "projects/nyar-types",
    "projects/nyar-vm",
    "projects/nyar-runtime",
]
exclude = ["examples/valkyrie-bootstrap"]

[profile.release]
lto = true
opt-level = "s"

[workspace.dependencies]
# Internal projects
nyar-vm = { path = "projects/nyar-vm" }
nyar-runtime = { path = "projects/nyar-runtime" }
nyar-types = { path = "projects/nyar-types" }
nyar-aot = { path = "projects/nyar-aot" }
nyar-macros = { path = "projects/nyar-macros" }
nyar-gc = { path = "projects/nyar-gc" }

