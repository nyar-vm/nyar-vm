[workspace]
resolver = "2"
members = ["projects/*", "examples/*"]
default-members = [
    "projects/nyar-error",
    "projects/nyar-vm",
    "projects/nyar-cli",
]
exclude = ["projects/nyar-wasm32-wasi"]

[profile.release]
lto = true
opt-level = "s"

[workspace.dependencies]
criterion = "0.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
byteorder = "1.5"

