name: TypeScript

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: pnpm install
      - name: Test npm packages
        run: pnpm --filter "./projects/packages/**" test
      - name: Prepare npm package readmes
        run: node scripts/prepare-npm-publish.mjs
