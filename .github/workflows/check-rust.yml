name: Rust

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

defaults:
  run:
    working-directory: projects/nyar.rs

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      # Runs before checkout, so it must not inherit the workspace working-directory.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v7
      - name: Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Install Wasm tooling
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools,wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/nyar.rs
      - name: Build
        run: cargo build --workspace

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      # Runs before checkout, so it must not inherit the workspace working-directory.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v7
      - name: Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Install Wasm tooling
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools,wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/nyar.rs
      - name: Tests
        run: cargo test --workspace --lib

  # 集成与模拟器夹具套件是独立门槛：它们覆盖真实 manifest → Compiler → 产物执行链路，
  # 必须与 build/test 同权，不再以 continue-on-error 掩盖失败。
  integration:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Runs before checkout, so it must not inherit the workspace working-directory.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v7
      - name: Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Install Wasm tooling
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools,wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/nyar.rs
      - name: Integration tests
        run: cargo test --workspace --tests --no-fail-fast
      - name: Host capability smoke (planner + browser-wasm build fixtures)
        run: |
          cargo test -p rusty-valkyrie hir_lowering_host_binding_pipeline_tests::bodyless_js_provider_carries_js_import_contract --no-fail-fast
          cargo test -p rusty-valkyrie hir_lowering_host_binding_pipeline_tests::same_source_file_unselected_js_provider_is_pruned_from_linked_imports --no-fail-fast
          cargo test -p rusty-valkyrie legion_planner::selects_js_get_provider_for_valkyrie_std_net_contract --no-fail-fast
          cargo test -p rusty-valkyrie legion_planner::selects_js_fetch_provider_by_target_capability_not_file_path --no-fail-fast
          cargo test -p rusty-valkyrie legion_planner::selects_js_random_provider_over_wasm_fallback_on_browser --no-fail-fast
          cargo test -p rusty-valkyrie legion_planner::selects_wasm_random_provider_on_wasi_target --no-fail-fast
          cargo test -p rusty-valkyrie legion_planner::selects_no_host_provider_when_std_contract_has_fallback_body --no-fail-fast
          cargo test -p rusty-valkyrie legion_planner::prunes_host_providers_not_referenced_by_entry_closure --no-fail-fast
          cargo test -p rusty-valkyrie legion_planner::reports_conflicting_js_providers_for_same_contract_on_browser --no-fail-fast
          cargo test -p rusty-valkyrie legion_planner::wasi_target_rejects_js_only_host_provider --no-fail-fast
          cargo test -p rusty-valkyrie builds_browser_wasm_js_random_host_binding_evidence --no-fail-fast
          cargo test -p rusty-valkyrie builds_wasi_wasm_random_host_binding_evidence --no-fail-fast
          cargo test -p rusty-valkyrie builds_valkyrie_fallback_random_without_host_bindings --no-fail-fast
          cargo test -p rusty-valkyrie builds_browser_wasm_prunes_unselected_host_bindings_from_evidence --no-fail-fast
          cargo test -p rusty-valkyrie legion_api_plan:: --no-fail-fast
          cargo test -p nyar-emitter --test lowering_features_physical_contract external_import_call_plans_with_import_parameter_types --no-fail-fast
          cargo test -p nyar-emitter --lib wasm_import_type_uses_backend_import_when_field_not_frozen --no-fail-fast
