name: Rust

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

defaults:
  run:
    working-directory: projects/nyar.rs

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Install Wasm tooling
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools,wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/nyar.rs
      - name: Build
        run: cargo build --workspace

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Install Wasm tooling
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools,wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/nyar.rs
      - name: Tests
        run: cargo test --workspace
