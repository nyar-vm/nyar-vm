name: Rust

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

defaults:
  run:
    working-directory: projects/nyar.rs

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      # Runs before checkout, so it must not inherit the workspace working-directory.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v7
      - name: Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Install Wasm tooling
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools,wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/nyar.rs
      - name: Build
        run: cargo build --workspace

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      # Runs before checkout, so it must not inherit the workspace working-directory.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v7
      - name: Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Install Wasm tooling
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools,wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/nyar.rs
      - name: Tests
        run: cargo test --workspace --lib
      # Windows 宿主模块（`.pyd` / `.node`）必须在真实解释器上验收；`--lib` 不含集成
      # 测试目标，因此在 windows runner 上补齐 legend-vm 的测试。
      - name: Windows host modules
        if: runner.os == 'Windows'
        run: cargo test -p legend-vm --tests --no-fail-fast

  # 集成与模拟器夹具套件是独立门槛：它们覆盖真实 manifest → Compiler → 产物执行链路，
  # 必须与 build/test 同权，不再以 continue-on-error 掩盖失败。
  integration:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Runs before checkout, so it must not inherit the workspace working-directory.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v7
      - name: Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Install Wasm tooling
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools,wasmtime
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/nyar.rs
      - name: Integration tests
        run: cargo test --workspace --tests --no-fail-fast
      - name: Host capability smoke (emitter physical contract)
        run: |
          cargo test -p nyar-emitter --test lowering_features_physical_contract external_import_call_plans_with_import_parameter_types --no-fail-fast
          cargo test -p nyar-emitter --lib wasm_import_type_uses_backend_import_when_field_not_frozen --no-fail-fast
