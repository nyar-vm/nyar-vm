[package]
name = "rusty-python"
version = "0.1.0"
edition = "2021"

[lib]
name = "rusty_python"
path = "src/lib.rs"

[dependencies]
chomsky-uir = { path = "../../../ProjectChomsky/packages/chomsky-uir" }
chomsky = { path = "../../../ProjectChomsky/packages/chomsky" }
oak-core = { path = "../../../oaks/projects/oak-core" }
oak-vfs = { path = "../../../oaks/projects/oak-vfs" }
oak-python = { path = "../../../oaks/examples/oak-python" }
nyar-types = { path = "../../projects/nyar-types" }
nyar-vm = { workspace = true }
chomsky-extract = { workspace = true }
chomsky-types = { workspace = true }
python-assembler = { workspace = true }
gaia-assembler = { workspace = true }
gaia-types = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tempfile = "3.10"
byteorder = "1.5"

[dev-dependencies]
