[package]
name = "mini-typescript"
version = "0.1.0"
edition = "2021"

[dependencies]
oak-typescript = { path = "../../../oaks/examples/oak-typescript" }
oak-core = { path = "../../../oaks/projects/oak-core" }
chomsky-full = { path = "../../../ProjectChomsky/packages/chomsky-full" }
chomsky-uir = { path = "../../../ProjectChomsky/packages/chomsky-uir" }
chomsky-types = { path = "../../../ProjectChomsky/packages/chomsky-types" }
chomsky-source = { path = "../../../ProjectChomsky/packages/chomsky-source" }
nyar-vm = { path = "../../projects/nyar-vm", features = ["clap"] }
nyar-types = { path = "../../projects/nyar-types" }
byteorder = { workspace = true }
tokio = { version = "1.42.0", features = ["full"] }
toml = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
oak-repl = { path = "../../../oaks/projects/oak-repl" }

[[bin]]
name = "tsc"
path = "bin/tsc.rs"

[[bin]]
name = "tsx"
path = "bin/tsx.rs"

[dev-dependencies]
tempfile = "3.3"
