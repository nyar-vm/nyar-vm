[package]
name = "mini-kotlin"
version = "0.1.0"
edition = "2021"

[dependencies]
oak-core = { path = "../../../oaks/projects/oak-core" }
oak-kotlin = { path = "../../../oaks/examples/oak-kotlin" }
chomsky-full = { path = "../../../ProjectChomsky/packages/chomsky-full" }
chomsky-uir = { path = "../../../ProjectChomsky/packages/chomsky-uir" }
chomsky-extract = { path = "../../../ProjectChomsky/packages/chomsky-extract" }
chomsky-cost = { path = "../../../ProjectChomsky/packages/chomsky-cost" }
chomsky-types = { path = "../../../ProjectChomsky/packages/chomsky-types" }
chomsky-source = { path = "../../../ProjectChomsky/packages/chomsky-source" }
nyar-vm = { path = "../../projects/nyar-vm" }
nyar-error = { path = "../../projects/nyar-error" }
byteorder = "1.5"

tokio = { version = "1.42.0", features = ["full"] }
wat = { version = "1.221.2", features = ["dwarf", "component-model"] }
wasmtime = "27.0.0"
wasmtime-wasi = "27.0.0"
c3-linearization = "0.1.0"
downcast = "0.11.0"
anyhow = "1.0.94"
wast = "222.0.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "kotlinc"
path = "bin/kotlinc.rs"

[[bin]]
name = "kotlin"
path = "bin/kotlin.rs"

[dev-dependencies]
tempfile = "3.3"
