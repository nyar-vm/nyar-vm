[package]
name = "nyar-emitter"
version.workspace = true
edition.workspace = true

authors.workspace = true
license.workspace = true
autotests = false

[features]
default = []
# 正式 Nyar 字节码编译与执行路径；Node/Wasm seed 默认不启用。
nyar-vm-lane = []

[dependencies]
# Layering: language → emitter → acorn-wasm (Wasm) + acorn-jvm (class/jar) + acorn-pe (coff/elf/PE/msil) + nyar-bytecode.
# Emitter must not depend on nyar-language.
acorn-jvm = { workspace = true }
acorn-pe = { workspace = true }
acorn-wasm = { workspace = true }
miette = { workspace = true }
nyar = { workspace = true }
nyar-bytecode = { workspace = true }
nyar-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
# Integration tests may compile Valkyrie sources via the language crate.
nyar-language = { workspace = true }
ordered-float = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "architecture_guards"
path = "tests/architecture_guards.rs"

[[test]]
name = "backend_runtime_contracts"
path = "tests/backend_runtime_contracts.rs"

[[test]]
name = "driver_compile_contracts"
path = "tests/driver_compile_contracts.rs"

[[test]]
name = "jvm_host_runtime"
path = "tests/jvm_host_runtime.rs"

[[test]]
name = "physical_contract_architecture_guards"
path = "tests/physical_contract_architecture_guards.rs"

[[test]]
name = "semantic_mir_architecture_guards"
path = "tests/semantic_mir_architecture_guards.rs"
