[workspace]
resolver = "2"
members = [
    "languages/rusty-bash",
    "languages/rusty-c",
    "languages/rusty-lua",
    "languages/rusty-powershell",
    "languages/rusty-tcl",
    "runtimes/legend-vm",
    "ffis/nyar-napi",
    "ffis/nyar-wasm",
    "compilers/nyar",
    "compilers/nyar-analyzer",
    "compilers/nyar-emitter",
    "compilers/nyar-format",
    "compilers/nyar-package-manager",
    "compilers/nyar-package-registry",
    "compilers/nyar-runner",
    "compilers/nyar-types",
    "compilers/nyar-workspace",
]
default-members = [
    "runtimes/legend-vm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nyar Team"]
license = "MIT"
repository = "https://github.com/nyar-vm/nyar-vm"

[workspace.dependencies]
# Boost 库，已使用本地 `.cargo/config.toml` 覆盖
boost-harness = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932", default-features = false, features = ["std", "serde"] }
interpreter-gc = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
compiler-analysis = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
compiler-emitter = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
compiler-target = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
compiler-specialize = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
compiler-types = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
interpreter-vm-ovm = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-binary-wasm = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-binary-jvm = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-binary-pe = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-binary-x64 = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-binary-aarch64 = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-binary-dex = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-binary-mach-o = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-binary-host = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
# `.odin` 字节码磁盘格式合同由 `data-binary-odin` 持有（自 Acorn 格式适配器内化）。
data-binary-odin = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
# 文本解析前端（自 Oak `examples/oak-voc` 内化，crate `data-text-awsl`）。
data-text-core = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-von = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932", features = ["serde"] }
data-text-valkyrie = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-awsl = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-bat = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-clojure = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-cmd = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-cobol = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
