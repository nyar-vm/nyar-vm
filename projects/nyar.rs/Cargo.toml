[workspace]
resolver = "2"
members = [
    "languages/rusty-bash",
    "languages/rusty-c",
    "languages/rusty-lua",
    "languages/rusty-powershell",
    "languages/rusty-tcl",
    "languages/rusty-valkyrie",
    "runtimes/legend-vm",
    "runtimes/odin-vm",
    "ffis/nyar-napi",
    "ffis/nyar-wasm",
    "ffis/valkyrie-napi",
    "compilers/nyar",
    "compilers/nyar-analyzer",
    "compilers/nyar-emitter",
    "compilers/nyar-format",
    "compilers/nyar-package-manager",
    "compilers/nyar-package-registry",
    "compilers/nyar-runner",
    "compilers/nyar-types",
    "compilers/nyar-workspace",
]
default-members = [
    "runtimes/odin-vm",
    "languages/rusty-valkyrie",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nyar Team"]
license = "MIT"
repository = "https://github.com/nyar-vm/nyar-vm"

[workspace.dependencies]
# Boost 库，已使用本地 `.cargo/config.toml` 覆盖
boost-diagnostic = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86", default-features = false, features = ["std", "serde"] }
interpreter-gc = { git = "https://github.com/oovm/rust-boost", rev = "849ee1b6d3f3db381c34c242cfd59f896eef3b67" }
compiler-analysis = { git = "https://github.com/oovm/rust-boost", rev = "849ee1b6d3f3db381c34c242cfd59f896eef3b67" }
compiler-emitter = { git = "https://github.com/oovm/rust-boost", rev = "849ee1b6d3f3db381c34c242cfd59f896eef3b67" }
compiler-target = { git = "https://github.com/oovm/rust-boost", rev = "849ee1b6d3f3db381c34c242cfd59f896eef3b67" }
compiler-specialize = { git = "https://github.com/oovm/rust-boost", rev = "849ee1b6d3f3db381c34c242cfd59f896eef3b67" }
compiler-types = { git = "https://github.com/oovm/rust-boost", rev = "849ee1b6d3f3db381c34c242cfd59f896eef3b67" }
interpreter-vm-ovm = { git = "https://github.com/oovm/rust-boost", rev = "849ee1b6d3f3db381c34c242cfd59f896eef3b67" }
acorn-wasm = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "c93c8c294d007ab16e12cbf4f7f95051340e9573" }
acorn-jvm = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "c93c8c294d007ab16e12cbf4f7f95051340e9573" }
acorn-pe = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "c93c8c294d007ab16e12cbf4f7f95051340e9573" }
acorn-x64 = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "c93c8c294d007ab16e12cbf4f7f95051340e9573" }
acorn-aarch64 = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "c93c8c294d007ab16e12cbf4f7f95051340e9573" }
acorn-dex = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "c93c8c294d007ab16e12cbf4f7f95051340e9573" }
acorn-mach-o = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "c93c8c294d007ab16e12cbf4f7f95051340e9573" }
acorn-host = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "c93c8c294d007ab16e12cbf4f7f95051340e9573" }
# `.odin` 字节码磁盘格式合同由 Acorn 格式适配器仓持有。
acorn-odin = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "c93c8c294d007ab16e12cbf4f7f95051340e9573" }
# Oak parser frontend (`examples/oak-voc` publishes crate `oak-awsl`). Bump `rev` with oak.rs releases.
oak-core = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "e68240f088b2f0657556eafd79aa0dca797e64dc" }
oak-von = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "e68240f088b2f0657556eafd79aa0dca797e64dc", features = ["serde"] }
oak-valkyrie = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "e68240f088b2f0657556eafd79aa0dca797e64dc" }
oak-awsl = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "e68240f088b2f0657556eafd79aa0dca797e64dc" }
language-format = { git = "https://github.com/oovm/rust-boost", rev = "849ee1b6d3f3db381c34c242cfd59f896eef3b67" }
language-highlight = { git = "https://github.com/oovm/rust-boost", rev = "849ee1b6d3f3db381c34c242cfd59f896eef3b67" }
compiler-valkyrie = { git = "https://github.com/oovm/rust-boost", rev = "849ee1b6d3f3db381c34c242cfd59f896eef3b67" }
# Nyar Compiler 编译期组件
nyar = { path = "compilers/nyar" }
nyar-analyzer = { path = "compilers/nyar-analyzer" }
nyar-types = { path = "compilers/nyar-types" }
nyar-format = { path = "compilers/nyar-format" }
nyar-runner = { path = "compilers/nyar-runner" }
nyar-package-manager = { path = "compilers/nyar-package-manager" }
nyar-package-registry = { path = "compilers/nyar-package-registry" }
nyar-workspace = { path = "compilers/nyar-workspace" }
nyar-emitter = { path = "compilers/nyar-emitter" }
# Nyar Runtime 运行时组件
legend-vm = { path = "runtimes/legend-vm" }
odin-vm = { path = "runtimes/odin-vm" }
# Guest 语言前端（各自独立 crate）
rusty-valkyrie = { path = "languages/rusty-valkyrie" }
rusty-bash = { path = "languages/rusty-bash" }
rusty-c = { path = "languages/rusty-c" }
rusty-lua = { path = "languages/rusty-lua" }
rusty-powershell = { path = "languages/rusty-powershell" }
rusty-tcl = { path = "languages/rusty-tcl" }
# 外部依赖
miette = "7.6.0"
ordered-float = "5.5.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha1 = "0.11.0"
sha2 = "0.11.1"
url = "2.5.8"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
pulldown-cmark = "0.13.4"
syntect = "5.3.0"
katex-rs = "0.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
flate2 = "1.1.10"
tar = "0.4.46"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
thiserror = "2.0.21"
napi = { version = "3.14.2", default-features = true, features = ["napi4"] }
napi-derive = "3.6.12"
napi-build = "2"
gag = "1.0.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
lto = false
opt-level = "s"

[profile.dev]
incremental = false

[profile.test]
incremental = false
