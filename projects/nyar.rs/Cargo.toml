[workspace]
resolver = "2"
members = [
    "languages/rusty-bash",
    "languages/rusty-c",
    "languages/rusty-lua",
    "languages/rusty-powershell",
    "languages/rusty-tcl",
    "languages/rusty-valkyrie",
    "runtimes/legend-vm",
    "runtimes/nyar-gc",
    "runtimes/nyar-jit",
    "runtimes/odin-vm",
    "ffis/nyar-napi",
    "ffis/nyar-wasm",
    "ffis/valkyrie-napi",
    "compilers/nyar",
    "compilers/nyar-analyzer",
    "compilers/nyar-emitter",
    "compilers/nyar-format",
    "compilers/nyar-optimizer",
    "compilers/nyar-package-manager",
    "compilers/nyar-package-registry",
    "compilers/nyar-runner",
    "compilers/nyar-types",
    "compilers/nyar-workspace",
]
default-members = [
    "runtimes/odin-vm",
    "languages/rusty-valkyrie",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nyar Team"]
license = "MIT"
repository = "https://github.com/nyar-vm/nyar-vm"

[workspace.dependencies]
# Boost 库，已使用本地 `.cargo/config.toml` 覆盖
boost-diagnostic = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86", default-features = false, features = ["std", "serde"] }
acorn-wasm = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "5cdde659a156a8f00f429182c7858e3b4c0a1cb4" }
acorn-jvm = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "5cdde659a156a8f00f429182c7858e3b4c0a1cb4" }
acorn-pe = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "5cdde659a156a8f00f429182c7858e3b4c0a1cb4" }
acorn-x64 = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "5cdde659a156a8f00f429182c7858e3b4c0a1cb4" }
acorn-aarch64 = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "5cdde659a156a8f00f429182c7858e3b4c0a1cb4" }
acorn-dex = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "5cdde659a156a8f00f429182c7858e3b4c0a1cb4" }
acorn-mach-o = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "5cdde659a156a8f00f429182c7858e3b4c0a1cb4" }
acorn-host = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "5cdde659a156a8f00f429182c7858e3b4c0a1cb4" }
# `.odin` 字节码磁盘格式合同由 Acorn 格式适配器仓持有。
acorn-odin = { git = "https://github.com/yggdrasil-language/acorn.rs", rev = "5cdde659a156a8f00f429182c7858e3b4c0a1cb4" }
# Oak parser frontend (`examples/oak-voc` publishes crate `oak-awsl`). Bump `rev` with oak.rs releases.
oak-core = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "fc94201d43926ac3f75b3a4f7dd10ac219d73f6e" }
oak-testing = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "fc94201d43926ac3f75b3a4f7dd10ac219d73f6e" }
oak-von = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "fc94201d43926ac3f75b3a4f7dd10ac219d73f6e", features = ["serde"] }
oak-valkyrie = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "fc94201d43926ac3f75b3a4f7dd10ac219d73f6e" }
oak-awsl = { git = "https://github.com/yggdrasil-language/oak.rs", rev = "fc94201d43926ac3f75b3a4f7dd10ac219d73f6e" }
# Legion corpora (`valkyrie.rs`). Bump `rev` after corpus changes land on that repo.
legion-fixtures = { git = "https://github.com/valkyrie-language/valkyrie.rs", rev = "9090e026" }
# Nyar Compiler 编译期组件
nyar = { path = "compilers/nyar" }
nyar-analyzer = { path = "compilers/nyar-analyzer" }
nyar-optimizer = { path = "compilers/nyar-optimizer" }
nyar-types = { path = "compilers/nyar-types" }
nyar-format = { path = "compilers/nyar-format" }
nyar-runner = { path = "compilers/nyar-runner" }
nyar-package-manager = { path = "compilers/nyar-package-manager" }
nyar-package-registry = { path = "compilers/nyar-package-registry" }
nyar-workspace = { path = "compilers/nyar-workspace" }
nyar-napi = { path = "ffis/nyar-napi" }
nyar-wasm = { path = "ffis/nyar-wasm" }
valkyrie-napi = { path = "ffis/valkyrie-napi" }
nyar-emitter = { path = "compilers/nyar-emitter" }
# Nyar Runtime 运行时组件
legend-vm = { path = "runtimes/legend-vm" }
odin-vm = { path = "runtimes/odin-vm" }
nyar-gc = { path = "runtimes/nyar-gc" }
nyar-jit = { path = "runtimes/nyar-jit" }
# Guest 语言前端（各自独立 crate）
rusty-valkyrie = { path = "languages/rusty-valkyrie" }
rusty-bash = { path = "languages/rusty-bash" }
rusty-c = { path = "languages/rusty-c" }
rusty-lua = { path = "languages/rusty-lua" }
rusty-powershell = { path = "languages/rusty-powershell" }
rusty-tcl = { path = "languages/rusty-tcl" }
# 外部依赖
miette = "7.6.0"
ordered-float = "5.5.0"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
toml_edit = "0.25.17+spec-1.1.0"
serde_yaml = "0.9.34"
sha1 = "0.11.0"
sha2 = "0.11.1"
url = "2.5.8"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
pulldown-cmark = "0.13.4"
syntect = "5.3.0"
katex-rs = "0.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
flate2 = "1.1.10"
tar = "0.4.46"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
thiserror = "2.0.21"
napi = { version = "3.14.2", default-features = true, features = ["napi4"] }
napi-derive = "3.6.12"
napi-build = "2"
gag = "1.0.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
lto = false
opt-level = "s"

[profile.dev]
incremental = false

[profile.test]
incremental = false
