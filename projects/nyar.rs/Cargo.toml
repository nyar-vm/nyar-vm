data-text-python = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-r = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-ruby = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-rust = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-scala = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-scheme = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-swift = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-typescript = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-wolfram = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
data-text-zig = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
language-repl = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
language-format = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
language-highlight = { git = "https://github.com/oovm/rust-boost", rev = "71db8fa50f49e3693640cbd19e64ad9c797e5932" }
# Nyar Compiler 编译期组件
nyar = { path = "compilers/nyar" }
nyar-analyzer = { path = "compilers/nyar-analyzer" }
nyar-types = { path = "compilers/nyar-types" }
nyar-format = { path = "compilers/nyar-format" }
nyar-runner = { path = "compilers/nyar-runner" }
nyar-package-manager = { path = "compilers/nyar-package-manager" }
nyar-package-registry = { path = "compilers/nyar-package-registry" }
nyar-workspace = { path = "compilers/nyar-workspace" }
nyar-emitter = { path = "compilers/nyar-emitter" }
# Nyar Runtime 运行时组件
legend-vm = { path = "runtimes/legend-vm" }
# OdinVM 已独立成仓；本 workspace 以 git `rev` 消费。
odin-vm = { git = "https://github.com/nyar-vm/odin-vm", rev = "ae43362ec6f80d3541f4d8859ce31550916f174f" }
# Guest 语言前端（各自独立 crate）
rusty-bash = { path = "languages/rusty-bash" }
rusty-c = { path = "languages/rusty-c" }
rusty-lua = { path = "languages/rusty-lua" }
rusty-powershell = { path = "languages/rusty-powershell" }
rusty-tcl = { path = "languages/rusty-tcl" }
# 外部依赖
miette = "7.6.0"
ordered-float = "5.5.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha1 = "0.11.0"
sha2 = "0.11.1"
url = "2.5.8"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
pulldown-cmark = "0.13.4"
syntect = "5.3.0"
katex-rs = "0.3.0"
flate2 = "1.1.10"
tar = "0.4.46"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
thiserror = "2.0.21"
napi = { version = "3.14.2", default-features = true, features = ["napi4"] }
napi-derive = "3.6.12"
napi-build = "2"
gag = "1.0.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
lto = false
opt-level = "s"

[profile.dev]
incremental = false

[profile.test]
incremental = false
