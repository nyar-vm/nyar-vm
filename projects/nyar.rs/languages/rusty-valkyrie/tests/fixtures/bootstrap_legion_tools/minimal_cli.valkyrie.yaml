targets:
- clr-microsoft-unknown-managed
- jvm-openjdk-unknown-managed
- wasm32-node-unknown-wasm
- wasm32-unknown-wasi-wasi
expect:
  clr-microsoft-unknown-managed:
    build_success: false
    dry_run_success: false
    run_success: false
    run_contracts: []
    per_artifact: {}
    artifacts: []
    compile_errors:
    - 'build failed for clr-microsoft-unknown-managed: no backend interpreter for fragment `functions` (family=Clr, host=Clr)'
    errors: []
  jvm-openjdk-unknown-managed:
    build_success: false
    dry_run_success: false
    run_success: false
    run_contracts: []
    per_artifact: {}
    artifacts: []
    compile_errors:
    - 'build failed for jvm-openjdk-unknown-managed: no backend interpreter for fragment `functions` (family=Jvm, host=Jvm)'
    errors: []
  wasm32-node-unknown-wasm:
    build_success: true
    dry_run_success: true
    run_success: true
    run_contracts:
    - logical_entry: main
      physical_entry: legion.mjs
      invocation: node
      validate: node legion.mjs
    per_artifact:
      legion.mjs:
        run_success: true
        exit_code: 0
        stdout: []
        stderr: []
    artifacts:
    - compile-evidence.txt
    - legion.mjs
    - legion.wasm
    - run-contracts.txt
    compile_errors: []
    errors: []
  wasm32-unknown-wasi-wasi:
    build_success: true
    dry_run_success: true
    run_success: false
    run_contracts:
    - logical_entry: _start
      physical_entry: legion.wasi
      invocation: wasmtime
      validate: wasmtime run -W gc -W wmemcheck -W max-memory-size=16777216 legion.wasi
    per_artifact:
      legion.wasi:
        run_success: false
        exit_code: 1
        stdout: []
        stderr:
        - 'Error: wmemcheck (memory checker) was requested but is not enabled in this build'
    artifacts:
    - compile-evidence.txt
    - legion.component-wit/
    - legion.component-wit/component.wit
    - legion.component-wit/deps/
    - legion.component-wit/deps/wasi-cli-0.2.12.wit
    - legion.core.wasm
    - legion.wasi
    - run-contracts.txt
    - wasmtime-config.toml
    - wasmtime-home/
    - wasmtime-local-app-data/
    - wasmtime-tmp/
    compile_errors: []
    errors: []
