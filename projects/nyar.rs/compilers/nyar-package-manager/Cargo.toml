[package]
name = "nyar-package-manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Nyar package manager core (install / resolve / publish)"

[dependencies]
base64 = { workspace = true }
flate2 = { workspace = true }
miette = { workspace = true }
nyar = { workspace = true }
nyar-format = { workspace = true, features = ["serde"] }
nyar-package-registry = { workspace = true }
package-resolve = { git = "https://github.com/oovm/rust-boost", rev = "9a7b37b13702e3f4461ceb6362effdfc79e0cdbe" }
acorn-odin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
oak-core = { workspace = true }
oak-von = { workspace = true, features = ["serde"] }
tar = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
