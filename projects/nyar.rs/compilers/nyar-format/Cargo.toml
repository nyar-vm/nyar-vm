[package]
name = "nyar-format"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Consumer facade re-exporting the Oak formatting contract with the Acorn text-format writers"
license.workspace = true
repository = "https://github.com/valkyrie-language/valkyrie.rs"

[features]
default = []
serde = ["language-format/serde"]

[dependencies]
data-binary-pe = { workspace = true }
data-binary-wasm = { workspace = true }
language-format = { workspace = true }

[dev-dependencies]
nyar-analyzer = { workspace = true }
data-text-von = { workspace = true }
