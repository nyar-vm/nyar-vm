[package]
name = "valkyrie-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Valkyrie product native binding (legion/asgard CLI and programmatic API)"

[lib]
name = "valkyrie_napi"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
napi.workspace = true
napi-derive.workspace = true
rusty-valkyrie = { workspace = true }
odin-vm = { workspace = true }
serde_json = { workspace = true }
windows-sys = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

[target.'cfg(not(windows))'.dependencies]
gag = { workspace = true }
