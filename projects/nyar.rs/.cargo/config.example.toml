# Copy to `config.toml` (gitignored). Do not commit real paths.
# Replace `<your-path>` with the directory that contains the sibling `rust-boost` checkout.
# CI and fresh clones use git `rev` from workspace `Cargo.toml` only.

[patch."https://github.com/oovm/rust-boost"]
boost-harness = { path = "<your-path>/rust-boost/projects/boost/boost.harness" }
data-binary-odin = { path = "<your-path>/rust-boost/projects/data/data.binary.odin" }
data-binary-pe = { path = "<your-path>/rust-boost/projects/data/data.binary.pe" }
data-binary-wasm = { path = "<your-path>/rust-boost/projects/data/data.binary.wasm" }
data-text-awsl = { path = "<your-path>/rust-boost/projects/data/data.text.awsl" }
data-text-core = { path = "<your-path>/rust-boost/projects/data/data.text.core" }
data-text-valkyrie = { path = "<your-path>/rust-boost/projects/data/data.text.valkyrie" }
data-text-von = { path = "<your-path>/rust-boost/projects/data/data.text.von" }
