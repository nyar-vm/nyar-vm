[package]
name = "nyar-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
nyar-gc = { workspace = true, features = ["tokio"] }
nyar-types = { workspace = true }
oak-core = { workspace = true }
oak-vfs = { workspace = true }
chomsky = { workspace = true }
chomsky-uir = { workspace = true }
chomsky-cost = { workspace = true }
chomsky-extract = { workspace = true }
chomsky-types = { workspace = true }
byteorder = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
indexmap = { workspace = true }
oak-json = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
wasi = { workspace = true, optional = true }

[features]
default = ["clap", "tokio"]
clap = ["dep:clap"]
tokio = ["dep:tokio", "nyar-gc/tokio"]
native = []
jvm = []
wasi = ["dep:wasi"]
