[package]
name = "nyar-vm"
version = "0.1.0"
edition = "2021"

[lib]
name = "nyar_vm"
path = "src/lib.rs"

[dependencies]
nyar-types = { path = "../nyar-types" }
nyar-gc = { path = "../nyar-gc" }
nyar-jit = { path = "../nyar-jit" }
nyar-aot = { path = "../nyar-aot" }
chomsky-uir = { path = "../../../ProjectChomsky/packages/chomsky-uir" }
serde = { workspace = true }
toml = { workspace = true }
byteorder = { workspace = true }
clap = { workspace = true, optional = true }
zip = "0.6"

[features]
default = []
clap = ["dep:clap"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "bench"
harness = false

# Force rebuild
